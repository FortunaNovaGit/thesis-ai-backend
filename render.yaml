services:
  - type: web
    name: thesis-ai-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: AGENT_MODE
        value: auto
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_API_KEY
        sync: false
      - key: BACKEND_TOKEN_SECRET
        generateValue: true
      - key: AUTO_APPROVE_MEDIUM_RISK
        value: "true"
      - key: WORDPRESS_MIN_REQUEST_INTERVAL_SECONDS
        value: "1.0"
      - key: WORDPRESS_RATE_LIMIT_RETRIES
        value: "5"
      - key: WORDPRESS_RATE_LIMIT_BASE_DELAY_SECONDS
        value: "3.0"
      - key: WORDPRESS_RATE_LIMIT_MAX_DELAY_SECONDS
        value: "45.0"
      - key: ALLOW_INSECURE_WORDPRESS
        value: "false"
      - key: ALLOW_PRIVATE_WORDPRESS
        value: "false"
