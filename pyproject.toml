[project]
name = "wp-multiagent-thesis"
version = "0.3.0"
description = "Installable 5-agent WordPress multi-agent system for a master's thesis"
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.6.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wp-multiagent = "app.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
