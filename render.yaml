services:
  - type: web
    name: thesis-ai-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: AGENT_MODE
        value: auto
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: OPENAI_API_KEY
        sync: false
      - key: BACKEND_TOKEN_SECRET
        generateValue: true
      - key: AUTO_APPROVE_MEDIUM_RISK
        value: "true"
      - key: MAX_REPAIR_LOOPS
        value: "2"
      - key: ALLOW_INSECURE_WORDPRESS
        value: "false"
      - key: ALLOW_PRIVATE_WORDPRESS
        value: "false"
