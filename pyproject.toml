[project]
name = "wp-multiagent-thesis"
version = "0.8.2"
description = "Artifact-driven five-agent WordPress/Elementor site builder prototype for a master's thesis"
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.22.0,<0.23.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "cryptography>=42.0",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wp-multiagent = "app.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
